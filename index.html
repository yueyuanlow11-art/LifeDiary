<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeDiary</title>
    <link rel="stylesheet" href="static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Dancing+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header class="top-nav">
        <div class="menu-icon" title="Settings" onclick="toggleSettingsPanel()">⚙️</div>
        <h1 class="nav-title">Home</h1>
        <div class="nav-icons">
            <span id="user-display" class="icon" style="font-size: 0.9rem; margin-right: 10px;"></span>
            <div class="logout-wrapper">
                <span class="icon" title="Logout" onclick="logout()" style="cursor: pointer;">Logout 🚪</span>
            </div>
            <div class="profile-photo-container" onclick="document.getElementById('profile-upload').click()">
                <img id="profile-img" src="" class="user-avatar" style="display: none;">
                <span id="profile-placeholder" class="icon user-avatar">👤</span>
            </div>
            <input type="file" id="profile-upload" style="display: none;" accept="image/*" onchange="uploadProfilePhoto(this)">
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- Auth View (Login/Signup) -->
        <section id="auth-view" class="auth-container">
            <div class="auth-card">
                <h2 id="auth-title" class="pixel-title">Welcome Back</h2>
                <div class="auth-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Password" required>
                        <span id="toggle-password" class="password-toggle" onclick="togglePasswordVisibility()">👁️</span>
                    </div>
                    <button id="auth-btn" class="btn-primary" onclick="handleAuth()">Login</button>
                    <p id="auth-toggle-text">Don't have an account? <a href="#" onclick="toggleAuthMode()">Sign up</a></p>
                </div>
                <div id="auth-error" class="error-text"></div>
            </div>
        </section>

        <!-- Dashboard View (My Life Diary) -->
        <section id="dashboard-view" class="hidden">
            <h2 class="pixel-title">My Life Diary</h2>
            <div id="entries-grid" class="entries-grid">
                <!-- Entries will be loaded here as cards -->
            </div>

            <div class="average-mood-section">
                <p>Average mood: <span id="avg-mood-percent">50%</span></p>
                <div class="mood-gauge">
                    <span class="mood-icon">☹️</span>
                    <div class="gauge-bar">
                        <div class="gauge-fill" style="width: 50%;"></div>
                    </div>
                    <span class="mood-icon">😊</span>
                </div>
            </div>

            <button class="btn-add" onclick="showEntryForm()">+</button>
        </section>

        <!-- Settings Panel -->
        <section id="settings-panel" class="settings-container hidden">
            <div class="settings-card">
                <div class="settings-header">
                    <div class="settings-profile">
                        <div class="profile-photo-container large" onclick="document.getElementById('profile-upload').click()">
                            <img id="settings-profile-img" src="" class="user-avatar" style="display: none;">
                            <span id="settings-profile-placeholder" class="icon user-avatar" style="font-size: 2rem;">👤</span>
                        </div>
                        <h2 class="settings-title">Your Account</h2>
                    </div>
                    <button class="close-btn" onclick="toggleSettingsPanel()">✕</button>
                </div>
                
                <div class="settings-list">
                    <div class="settings-item" onclick="showSubSetting('security')">
                        <span>Security and Privacy</span>
                    </div>
                    <div class="settings-item" onclick="showSubSetting('theme')">
                        <span>Theme</span>
                    </div>
                    <div class="settings-item" onclick="showSubSetting('storage')">
                        <span>Storage</span>
                    </div>
                    <div class="settings-item" onclick="logout()">
                        <span>Log out</span>
                    </div>
                    <div class="settings-item" onclick="showSubSetting('mood-history')">
                        <span>Mood history</span>
                    </div>
                    <div class="settings-item danger" onclick="confirmDeleteAccount()">
                        <span>Delete account</span>
                    </div>
                </div>

                <!-- Sub-settings Modals (Simplified for now) -->
                <div id="subsetting-modal" class="subsetting-modal hidden">
                    <div class="modal-content">
                        <div id="subsetting-content"></div>
                        <button class="btn-primary" onclick="closeSubSetting()">Back</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Entry Form View (Dear diary...) -->
        <section id="entry-view" class="hidden">
            <div class="diary-page">
                <div class="page-header">
                    <div class="title-section">
                        <h2 id="display-title" class="script-title">Dear diary...</h2>
                        <input type="text" id="edit-title" class="title-input hidden" placeholder="Diary Name">
                        <button id="btn-rename" class="btn-rename" onclick="toggleRename()">✏️</button>
                    </div>
                    <div class="header-info">
                        <div class="date-line">DATE: <span id="current-date"></span></div>
                        <div class="page-counter">PAGE: <span id="page-number">1</span></div>
                        <div id="real-time-mood" class="real-time-mood-label">Mood: Thinking...</div>
                        <button class="btn-delete-diary" onclick="deleteEntry()">Delete Entry 🗑️</button>
                    </div>
                </div>
                <textarea id="diaryInput" placeholder="Write your thoughts..."></textarea>
                
                <div class="page-navigation">
                    <button class="btn-page" onclick="prevPage()">⬅️ Previous Page</button>
                    <button class="btn-page btn-delete-page" onclick="deleteCurrentPage()">Delete Page ❌</button>
                    <button class="btn-page" onclick="nextPage()">Next Page ➡️</button>
                </div>

                <div class="page-footer-tools">
                    <button class="tool-icon" onclick="saveEntry()">✔️</button>
                    <button class="tool-icon">#</button>
                    <button class="tool-icon">📷</button>
                    <button class="tool-icon">🎨</button>
                    <button class="tool-icon">T</button>
                </div>
            </div>
            <button class="btn-back" onclick="showDashboard()">Back to Home</button>
        </section>

        <div id="result"></div>
    </main>
</div>

<script src="static/script.js"></script>
</body>
</html>
